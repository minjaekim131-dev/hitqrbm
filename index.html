<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HitQR - 음악 맞추기 게임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="brand" href="index.html">HitQR</a>
    <a class="nav-link" href="maker.html">카드 만들기</a>
  </div>

  <!-- 홈 -->
  <section class="view active" id="view-home">
    <div class="hero">
      <h1 class="logo">HitQR</h1>
      <p class="tagline">QR을 찍고, 소리만 듣고, 노래를 맞혀 보세요</p>
    </div>
    <div class="rules">
      <ol>
        <li><strong>QR 스캔</strong> 후 재생 버튼을 누르고 <strong>휴대폰을 뒤집어 두세요</strong></li>
        <li>소리만 듣고 노래(영상)를 맞힙니다</li>
        <li>시간이 다 되면 <strong>알람과 함께 정답이 공개</strong>됩니다</li>
      </ol>
    </div>
    <div class="setting-row">
      <label for="timer-select">정답 공개까지</label>
      <select id="timer-select">
        <option value="15">15초</option>
        <option value="20">20초</option>
        <option value="30" selected>30초</option>
        <option value="45">45초</option>
        <option value="60">60초</option>
      </select>
    </div>
    <button class="btn btn-primary" id="btn-start">게임 시작</button>
  </section>

  <!-- 스캔 -->
  <section class="view" id="view-scan">
    <div class="scan-stage">
      <video id="cam" playsinline muted></video>
      <div class="scan-frame"><div class="box"></div></div>
    </div>
    <p class="scan-hint">카드의 QR코드를 사각형 안에 맞춰 주세요</p>
    <div class="manual-box">
      <input type="url" id="manual-url" placeholder="또는 유튜브 링크 직접 붙여넣기">
      <button class="btn btn-ghost btn-small" id="btn-manual">확인</button>
    </div>
    <p class="error-msg" id="scan-error"></p>
    <button class="btn btn-ghost" id="btn-scan-cancel" style="margin-top:12px">홈으로</button>
  </section>

  <!-- 게임 (준비 / 재생 / 정답) -->
  <section class="view" id="view-game">
    <div class="game-head">

      <div id="phase-ready">
        <span class="phase-badge">READY</span>
        <h2>카드 인식 완료!</h2>
        <p>재생을 누른 뒤 휴대폰을 뒤집어 두세요</p>
        <button class="btn btn-primary" id="btn-play">재생 시작</button>
      </div>

      <div id="phase-playing" hidden>
        <span class="phase-badge">LISTEN</span>
        <div class="countdown" id="countdown">30</div>
        <div class="progress"><i id="progress-bar"></i></div>
        <div class="flip-note">지금 휴대폰을 뒤집어 두세요! 알람이 울리면 정답이 공개됩니다</div>
      </div>

      <div id="phase-answer" hidden>
        <span class="phase-badge">ANSWER</span>
        <div class="answer-title" id="answer-title">정답 공개!</div>
      </div>

    </div>

    <div class="player-shell" id="player-shell" hidden>
      <div id="player"></div>
    </div>

    <div class="btn-row" id="playing-buttons" hidden>
      <button class="btn btn-ghost" id="btn-replay">한 번 더 듣기</button>
      <button class="btn btn-primary" id="btn-giveup">정답 확인</button>
    </div>

    <div class="btn-row" id="answer-buttons" hidden>
      <button class="btn btn-primary" id="btn-next">다음 카드</button>
      <button class="btn btn-ghost" id="btn-home">홈으로</button>
    </div>
  </section>

</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  // ---------- state ----------
  var card = null;          // {videoId, start, end}
  var player = null;
  var playerReady = false;
  var ytApiReady = false;
  var pendingCreate = false;
  var timerId = null;
  var deadline = 0;
  var timerLen = parseInt(localStorage.getItem('hitqr.timer') || '30', 10);
  var audioCtx = null;
  var wakeLock = null;
  var stream = null;
  var rafId = 0;

  $('timer-select').value = String(timerLen);

  // ---------- view switching ----------
  function showView(name) {
    ['home', 'scan', 'game'].forEach(function (v) {
      $('view-' + v).classList.toggle('active', v === name);
    });
  }

  function showPhase(name) {
    $('phase-ready').hidden = name !== 'ready';
    $('phase-playing').hidden = name !== 'playing';
    $('phase-answer').hidden = name !== 'answer';
    $('player-shell').hidden = name === 'ready';
    $('playing-buttons').hidden = name !== 'playing';
    $('answer-buttons').hidden = name !== 'answer';
  }

  // ---------- QR payload parsing ----------
  function parseCard(text) {
    var url;
    try { url = new URL(text.trim()); } catch (e) { return null; }
    var host = url.hostname.replace(/^(www\.|m\.)/, '');
    var id = null;
    if (host === 'youtu.be') {
      id = url.pathname.slice(1).split('/')[0];
    } else if (host === 'youtube.com' || host === 'music.youtube.com') {
      if (url.pathname === '/watch') id = url.searchParams.get('v');
      else if (url.pathname.indexOf('/embed/') === 0) id = url.pathname.split('/')[2];
      else if (url.pathname.indexOf('/shorts/') === 0) id = url.pathname.split('/')[2];
    }
    if (!id || !/^[\w-]{6,20}$/.test(id)) return null;
    var t = url.searchParams.get('t') || url.searchParams.get('start') || '0';
    var start = parseInt(String(t).replace(/s$/, ''), 10) || 0;
    var end = parseInt(url.searchParams.get('end') || '0', 10) || 0;
    if (!end || end <= start) end = start + 7;
    return { videoId: id, start: start, end: end };
  }

  // ---------- camera scan ----------
  function startScan() {
    showView('scan');
    $('scan-error').textContent = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $('scan-error').textContent = '이 브라우저에서 카메라를 쓸 수 없어요. 아래에 링크를 직접 붙여넣어 주세요.';
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(function (s) {
        stream = s;
        var video = $('cam');
        video.srcObject = s;
        return video.play();
      })
      .then(function () { scanLoop(); })
      .catch(function () {
        $('scan-error').textContent = '카메라를 열 수 없어요. 권한을 허용했는지 확인하거나, 링크를 직접 붙여넣어 주세요.';
      });
  }

  function scanLoop() {
    if (!stream) return;
    var video = $('cam');
    if (video.readyState >= 2) {
      var w = video.videoWidth, h = video.videoHeight;
      if (w && h) {
        var canvas = scanLoop._canvas || (scanLoop._canvas = document.createElement('canvas'));
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(video, 0, 0, w, h);
        var img = ctx.getImageData(0, 0, w, h);
        var code = window.jsQR ? jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' }) : null;
        if (code && code.data) {
          var parsed = parseCard(code.data);
          if (parsed) { onCardFound(parsed); return; }
        }
      }
    }
    rafId = requestAnimationFrame(scanLoop);
  }

  function stopScan() {
    cancelAnimationFrame(rafId);
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    $('cam').srcObject = null;
  }

  function onCardFound(parsed) {
    stopScan();
    card = parsed;
    showView('game');
    showPhase('ready');
  }

  // ---------- YouTube player ----------
  window.onYouTubeIframeAPIReady = function () {
    ytApiReady = true;
    if (pendingCreate) { pendingCreate = false; createPlayer(); }
  };
  if (window.YT && window.YT.Player) ytApiReady = true;

  function createPlayer() {
    player = new YT.Player('player', {
      videoId: card.videoId,
      playerVars: {
        start: card.start,
        end: card.end,
        autoplay: 1,
        playsinline: 1,
        rel: 0,
        controls: 1
      },
      events: {
        onReady: function () { playerReady = true; }
      }
    });
  }

  function loadClip() {
    if (player && playerReady) {
      player.loadVideoById({ videoId: card.videoId, startSeconds: card.start, endSeconds: card.end });
    } else if (!player) {
      if (ytApiReady) createPlayer();
      else pendingCreate = true;
    }
  }

  // ---------- timer / alarm ----------
  function beginPlay() {
    showPhase('playing');
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { /* no sound alarm available */ }
    requestWake();
    loadClip();
    deadline = Date.now() + timerLen * 1000;
    updateTimer();
    timerId = setInterval(updateTimer, 200);
  }

  function updateTimer() {
    var remain = Math.max(0, deadline - Date.now());
    $('countdown').textContent = String(Math.ceil(remain / 1000));
    $('progress-bar').style.width = (remain / (timerLen * 1000) * 100) + '%';
    if (remain <= 0) {
      clearInterval(timerId);
      timerId = null;
      playAlarm();
      reveal();
    }
  }

  function playAlarm() {
    if (!audioCtx) return;
    var t0 = audioCtx.currentTime + 0.05;
    [0, 0.28, 0.56].forEach(function (dt, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = i === 2 ? 1318 : 1046;
      gain.gain.setValueAtTime(0.0001, t0 + dt);
      gain.gain.exponentialRampToValueAtTime(0.4, t0 + dt + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.24);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0 + dt);
      osc.stop(t0 + dt + 0.26);
    });
  }

  function reveal() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    releaseWake();
    showPhase('answer');
    var title = '정답 공개!';
    try {
      var data = player && player.getVideoData && player.getVideoData();
      if (data && data.title) title = data.title;
    } catch (e) { /* keep default title */ }
    $('answer-title').textContent = title;
    // replay the scene (video visible this time) from the clip start;
    // no end limit so the answer scene can keep playing
    if (player && playerReady) {
      player.loadVideoById({ videoId: card.videoId, startSeconds: card.start });
    }
  }

  // ---------- wake lock ----------
  function requestWake() {
    if (navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen')
        .then(function (l) { wakeLock = l; })
        .catch(function () { /* not critical */ });
    }
  }

  function releaseWake() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }

  // ---------- events ----------
  $('timer-select').addEventListener('change', function () {
    timerLen = parseInt(this.value, 10);
    localStorage.setItem('hitqr.timer', this.value);
  });

  $('btn-start').addEventListener('click', startScan);
  $('btn-scan-cancel').addEventListener('click', function () { stopScan(); showView('home'); });

  $('btn-manual').addEventListener('click', function () {
    var parsed = parseCard($('manual-url').value);
    if (parsed) { $('manual-url').value = ''; onCardFound(parsed); }
    else $('scan-error').textContent = '유튜브 링크를 알아볼 수 없어요. 다시 확인해 주세요.';
  });

  $('btn-play').addEventListener('click', beginPlay);
  $('btn-replay').addEventListener('click', loadClip);
  $('btn-giveup').addEventListener('click', reveal);

  $('btn-next').addEventListener('click', function () {
    if (player && playerReady) player.stopVideo();
    startScan();
  });

  $('btn-home').addEventListener('click', function () {
    if (player && playerReady) player.stopVideo();
    showView('home');
  });
})();
</script>
</body>
</html>
