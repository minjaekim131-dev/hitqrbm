name: Pupil Windows Native Test

on:
  workflow_dispatch:
  push:
    branches:
      - pupil-windows-test

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build WPF project
        shell: pwsh
        run: dotnet build pupil-native/PupilDesktop/PupilDesktop.csproj -c Release

      - name: Create network smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pupil-native/PupilDesktop.SmokeTest | Out-Null
          $csproj = @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="..\PupilDesktop\PupilDesktop.csproj" />
            </ItemGroup>
          </Project>
          "@
          $csproj | Set-Content -Encoding UTF8 pupil-native/PupilDesktop.SmokeTest/PupilDesktop.SmokeTest.csproj

          $program = @'
          using PupilDesktop.Core;
          using PupilDesktop.Models;

          Console.WriteLine("Pupil Desktop smoke test starting...");
          using var client = new HitomiClient();
          var ids = await client.SearchAsync("", SortMode.DateAdded);
          if (ids.Count == 0) throw new Exception("Latest gallery search returned zero results.");
          var galleryId = ids[0];
          Console.WriteLine($"Latest gallery ID: {galleryId}");
          var info = await client.GetGalleryInfoAsync(galleryId);
          if (info.Files.Count == 0) throw new Exception($"Gallery {galleryId} has no files.");
          Console.WriteLine($"Title: {info.Title}");
          Console.WriteLine($"Pages: {info.Files.Count}");

          var tagSearchOk = false;
          foreach (var tag in (info.Tags ?? []).Where(t => !string.IsNullOrWhiteSpace(t.Tag)).Take(12))
          {
              var prefix = !string.IsNullOrWhiteSpace(tag.Female) ? "female"
                         : !string.IsNullOrWhiteSpace(tag.Male) ? "male"
                         : "tag";
              var query = $"{prefix}:{tag.Tag.Replace(' ', '_')}";
              var tagIds = await client.SearchAsync(query, SortMode.DateAdded);
              if (tagIds.Count > 0)
              {
                  Console.WriteLine($"Tag search OK: {query} -> {tagIds.Count:N0} results");
                  tagSearchOk = true;
                  break;
              }
          }
          if (!tagSearchOk) throw new Exception("No metadata tag produced a valid tag-search result.");

          var urls = await client.GetReaderWebpImageUrlsAsync(info);
          if (urls.Count == 0) throw new Exception("Reader URL generation returned zero URLs.");
          Console.WriteLine($"First image URL: {urls[0]}");
          var bytes = await client.DownloadBytesAsync(urls[0]);
          if (bytes.Length < 1024) throw new Exception($"First image download was unexpectedly small: {bytes.Length} bytes.");
          Console.WriteLine($"Downloaded first image: {bytes.Length:N0} bytes");
          Console.WriteLine("NETWORK_SMOKE_OK");
          '@
          $program | Set-Content -Encoding UTF8 pupil-native/PupilDesktop.SmokeTest/Program.cs

      - name: Run Hitomi network smoke test
        shell: pwsh
        run: dotnet run --project pupil-native/PupilDesktop.SmokeTest/PupilDesktop.SmokeTest.csproj -c Release

      - name: Publish single-file Windows app
        shell: pwsh
        run: |
          dotnet publish pupil-native/PupilDesktop/PupilDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          if (-not (Test-Path publish/PupilDesktop.exe)) { throw "PupilDesktop.exe was not produced." }
          Get-ChildItem publish | Format-Table Name, Length

      - name: Launch GUI smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE\publish\PupilDesktop.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "PupilDesktop.exe exited during launch test. ExitCode=$($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "GUI_LAUNCH_SMOKE_OK"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PupilDesktop-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 7
